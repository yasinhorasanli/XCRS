# Career roles, levels and common paths between them (ADR-0027).
#
# A role is a kind of work (Backend Engineer), not a seniority. Seniority is a level on one shared
# ladder; each role's roadmap (roadmaps/<role>.yaml) says what each level adds. Moving up a level
# inside a role is implied; any role can move to any other (see common_paths below).
#
# onet: the O*NET-SOC occupation the role belongs to. O*NET occupations are broader than market
# titles (DevOps, SRE and mobile all sit under 15-1252/15-1299.08), so several roles share one.
# esco: the closest ESCO occupation (URI), found with the ESCO API and chosen by hand (2026-10-02);
# null where ESCO has no close occupation. ESCO © European Union, reused under the ESCO terms.
#
# also_called: other market titles for the same job, so search and job-title matching find the role; results list
# them as titles to search for (ADR-0044).
# title_skills: languages and frameworks that job ads put in the title ("Java Backend Engineer"); the learner's
# strongest one makes a title for them (ADR-0044). They must be in the role's roadmap.
# A title can list `adds`, the skills it asks for on top of the role (Product Engineer = Full-Stack +
# product analytics, experiments...). The validator measures it: when the role covers less than 80% of
# the title, the title is a different job and must become a role of its own (ADR-0027).

levels:
  entry:
    name: Entry
    typical_years: "0-2"
    scope: Delivers well-defined tasks with guidance; learns the team's stack and practices.
  mid:
    name: Mid-level
    typical_years: "2-5"
    scope: Owns features end to end without close supervision; reviews peers' work.
  senior:
    name: Senior
    typical_years: "5+"
    scope: Owns systems, makes design trade-offs, mentors others and handles the hard incidents.
  staff:
    name: Staff / Principal
    typical_years: "8+"
    scope: Sets technical direction across teams; solves problems no single team owns.

families:
  product-engineering: Product engineering
  quality-engineering: Quality engineering
  infrastructure: Infrastructure and reliability
  data-ai: Data and AI
  security: Security
  web3: Web3
  customer-engineering: Customer-facing engineering
  leadership: Architecture and leadership

