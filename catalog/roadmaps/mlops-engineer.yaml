# Roadmap for mlops-engineer (ADR-0027, ADR-0028). Levels are cumulative: each adds to the ones before.
# Skills are 'skill:proficiency' (1 basic, 2 working, 3 advanced, 4 expert); 'a|b:2' means one of them.
role: mlops-engineer
levels:
  mid:
    summary: "Runs the pipelines and infrastructure that train, deploy and monitor models. Usually entered from DevOps or ML engineering."
    stages:
      - name: Engineering foundations
        skills: [programming-fundamentals:2, python:2, linux:2, shell-scripting:1, git:2, computer-networking:2, http:2, sql:2]
      - name: Infrastructure
        skills: [docker:2, kubernetes:2, ci-cd:2, cloud-fundamentals:2, "aws|azure|gcp:2", infrastructure-as-code:1, terraform:1, observability:2]
      - name: ML lifecycle
        skills: [statistics:2, linear-algebra:1, machine-learning-fundamentals:1, ml-pipelines:2, experiment-tracking:2, rest-api-design:1, model-serving:2]
  senior:
    summary: "Designs the ML platform: monitoring, LLM serving, orchestration and cost."
    stages:
      - name: ML platform
        skills: [machine-learning-fundamentals:2, model-evaluation:1, model-monitoring:2, llm-fundamentals:2, llm-serving:2, etl-pipelines:1, airflow:1]
      - name: Operations
        skills: [gitops:1, helm:2, prometheus-grafana:2, finops:1]
      - name: Leadership
        skills: [mentoring:2, technical-writing:2]
  staff:
    summary: "Sets ML platform direction across the organization."
    stages:
      - name: Direction
        skills: [infrastructure-as-code:2, internal-developer-platforms:2, llm-serving:3, finops:2, technical-leadership:3, stakeholder-communication:3]
      - name: Depth and influence
        skills: [agile-scrum:2, mentoring:3, engineering-processes:2, product-thinking:3, llm-serving:4]
