# Roadmap for full-stack-engineer (ADR-0027, ADR-0028). Levels are cumulative: each adds to the ones before.
# Skills are 'skill:proficiency' (1 basic, 2 working, 3 advanced, 4 expert); 'a|b:2' means one of them.
role: full-stack-engineer
levels:
  entry:
    summary: "Builds small features from database to UI in a JavaScript/TypeScript stack, with guidance."
    stages:
      - name: Foundations
        skills: [programming-fundamentals:2, javascript:2, typescript:2, oop:2, data-structures:2, git:2, linux:1, computer-networking:2, http:2, debugging:2, operating-systems:1]
      - name: Front end
        skills: [html:2, css:2, dom:2, "react|vue:2", responsive-design:1, browser-devtools:1]
      - name: Back end
        skills: [nodejs:2, rest-api-design:2, sql:2, relational-databases:1, postgresql:1, orm:1]
      - name: Quality
        skills: [testing-fundamentals:1, unit-testing:1, code-review:1]
  mid:
    summary: "Delivers whole product features, including auth, data design, deployment and tests."
    stages:
      - name: Product delivery
        skills: ["nextjs|nuxt:2", state-management:2, authentication-authorization:2, relational-databases:2, database-design:2, caching:1]
      - name: Production
        skills: [linux:2, docker:1, ci-cd:2, cloud-fundamentals:1, observability:1, web-security:2]
      - name: Quality
        skills: [testing-fundamentals:2, unit-testing:2, integration-testing:2, e2e-testing:2, frontend-testing:1]
      - name: Good to know
        optional: true
        skills: [nosql-databases:1, mongodb:1, graphql:1]
  senior:
    summary: "Designs features and systems across the stack, balancing product needs and technical quality."
    stages:
      - name: System design
        skills: [concurrency:2, distributed-systems:2, caching:2, system-design:2, design-patterns:2, browser-devtools:2, web-performance:2]
      - name: Leadership
        skills: [mentoring:2, technical-writing:2, product-thinking:3, code-review:3, project-planning:2]
  staff:
    summary: "Owns the architecture of a product across front end and back end."
    stages:
      - name: Direction
        skills: [architecture-patterns:3, system-design:3, frontend-architecture:2, architecture-decision-records:3, technical-leadership:3, stakeholder-communication:3]
      - name: Depth and influence
        skills: [agile-scrum:2, mentoring:3, engineering-processes:2, architecture-patterns:4, code-review:4]
