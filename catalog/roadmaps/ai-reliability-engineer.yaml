# Roadmap for ai-reliability-engineer (ADR-0027, ADR-0028). Levels are cumulative: each adds to the ones before.
# Skills are 'skill:proficiency' (1 basic, 2 working, 3 advanced, 4 expert); 'a|b:2' means one of them.
role: ai-reliability-engineer
levels:
  mid:
    summary: "Keeps AI features dependable in production: evaluations, guardrails, monitoring and AI incidents. Usually entered from SRE, MLOps or AI engineering."
    stages:
      - name: Engineering foundations
        skills: [programming-fundamentals:2, python:2, linux:2, git:2, computer-networking:2, http:2, rest-api-design:1]
      - name: Reliability
        skills: [docker:2, kubernetes:1, observability:2, prometheus-grafana:1, sre-practices:2, incident-management:2]
      - name: AI quality
        skills: [llm-fundamentals:2, prompt-engineering:2, llm-evaluation:2, ai-guardrails:2, llm-serving:1, statistics:1]
  senior:
    summary: "Designs evaluation and guardrail systems, sets reliability targets for AI features and leads AI incident response."
    stages:
      - name: AI reliability
        skills: [llm-evaluation:3, ai-guardrails:3, llm-serving:2, statistics:2, linear-algebra:1, machine-learning-fundamentals:2, model-evaluation:1, model-monitoring:2]
      - name: Security and safety
        skills: [operating-systems:1, security-fundamentals:1, web-security:1]
      - name: Leadership
        skills: [kubernetes:2, chaos-engineering:1, mentoring:2, technical-writing:2]
  staff:
    summary: "Sets how the organization makes AI dependable: evaluation standards, safety policy and reliability targets."
    stages:
      - name: Direction
        skills: [ai-guardrails:4, llm-evaluation:4, sre-practices:3, technical-leadership:3, stakeholder-communication:3]
