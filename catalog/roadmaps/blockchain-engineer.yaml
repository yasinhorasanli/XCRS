# Roadmap for blockchain-engineer (ADR-0027, ADR-0028). Levels are cumulative: each adds to the ones before.
# Skills are 'skill:proficiency' (1 basic, 2 working, 3 advanced, 4 expert); 'a|b:2' means one of them.
role: blockchain-engineer
levels:
  entry:
    summary: "Writes and tests smart contracts and dApp integrations, under guidance."
    stages:
      - name: Programming
        skills: [programming-fundamentals:2, javascript:2, typescript:1, git:2, testing-fundamentals:1, unit-testing:1]
      - name: Distributed foundations
        skills: [computer-networking:2, operating-systems:1, concurrency:2, distributed-systems:1, security-fundamentals:1, cryptography-basics:1]
      - name: Smart contracts
        skills: [blockchain-fundamentals:2, ethereum:2, solidity:2, smart-contract-testing:1, web3-libraries:1]
  mid:
    summary: "Owns contracts and dApps end to end, with security in mind."
    stages:
      - name: Contracts
        skills: [smart-contract-security:2, smart-contract-testing:2, defi-protocols:1, unit-testing:2]
      - name: dApps and services
        skills: [web3-libraries:2, html:1, dom:1, react:1, http:2, rest-api-design:1, nodejs:1, code-review:1]
  senior:
    summary: "Designs protocols and contract systems and leads security reviews."
    stages:
      - name: Protocols
        skills: [ethereum:3, defi-protocols:2, layer2-scaling:1, smart-contract-security:3, cryptography-basics:2, distributed-systems:2, security-fundamentals:2, threat-modeling:2]
      - name: Leadership
        skills: [mentoring:2, technical-writing:2]
  staff:
    summary: "Sets protocol and Web3 direction across teams."
    stages:
      - name: Direction
        skills: [layer2-scaling:2, smart-contract-security:4, architecture-decision-records:2, technical-leadership:3, stakeholder-communication:3]
      - name: Depth and influence
        skills: [agile-scrum:2, architecture-decision-records:3, mentoring:3, engineering-processes:2, product-thinking:3, ethereum:4]
