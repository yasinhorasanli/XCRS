# Roadmap for devops-engineer (ADR-0027, ADR-0028). Levels are cumulative: each adds to the ones before.
# Skills are 'skill:proficiency' (1 basic, 2 working, 3 advanced, 4 expert); 'a|b:2' means one of them.
role: devops-engineer
levels:
  entry:
    summary: "Maintains pipelines, containers and basic cloud resources, under guidance."
    stages:
      - name: Systems foundations
        skills: [programming-fundamentals:2, linux:2, shell-scripting:2, "python|go:2", git:2, computer-networking:2, http:1, operating-systems:1, data-structures:1, sql:2, relational-databases:2]
      - name: Containers and pipelines
        skills: [docker:2, ci-cd:2, "github-actions|jenkins:2", cloud-fundamentals:1, "aws|azure|gcp:1"]
  mid:
    summary: "Owns infrastructure as code, Kubernetes deployments and monitoring for services."
    stages:
      - name: Infrastructure
        skills: [kubernetes:2, helm:1, infrastructure-as-code:2, terraform:2, ansible:1, cloud-fundamentals:2, "aws|azure|gcp:2"]
      - name: Good to know
        optional: true
        skills: [regular-expressions:1, powershell:1]
      - name: Running services
        skills: [observability:2, prometheus-grafana:2, incident-management:1, identity-access-management:1, secrets-management:1, cloud-networking:1]
  senior:
    summary: "Designs delivery and infrastructure platforms with security, cost and reliability in mind."
    stages:
      - name: Platform
        skills: [kubernetes:3, gitops:2, terraform:3, cloud-networking:2, sre-practices:1, incident-management:2]
      - name: Security and cost
        skills: [security-fundamentals:2, vulnerability-management:1, devsecops:2, finops:1]
      - name: Leadership
        skills: [mentoring:2, technical-writing:2]
  staff:
    summary: "Sets infrastructure direction across the organization."
    stages:
      - name: Systems thinking
        skills: [caching:2, database-design:2, concurrency:2, distributed-systems:2, system-design:2]
      - name: Direction
        skills: [internal-developer-platforms:2, cloud-architecture:2, architecture-decision-records:2, finops:2, technical-leadership:3, stakeholder-communication:3]
