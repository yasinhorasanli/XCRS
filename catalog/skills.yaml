  terraform:
    name: Terraform
    kind: tool
    description: Declarative infrastructure provisioning across providers.
    requires: [infrastructure-as-code:1]
    onet: [IBM Terraform, Amazon Web Services AWS CloudFormation]
  ansible:
    name: Ansible
    kind: tool
    description: Agentless configuration management and automation.
    requires: [linux:2]
    onet: [Ansible software, Chef, Puppet]
  observability:
    name: Observability
    kind: concept
    description: Logs, metrics, traces and alerting that explain what a system is doing.
    requires: [linux:1]
  prometheus-grafana:
    name: Prometheus and Grafana
    kind: tool
    description: Metrics collection, queries, dashboards and alerts.
    requires: [observability:1]
    onet: [Prometheus, Grafana Labs Grafana Cloud]
  opentelemetry:
    name: OpenTelemetry
    kind: tool
    description: Vendor-neutral instrumentation for traces, metrics and logs.
    requires: [observability:2]
  sre-practices:
    name: SRE practices
    kind: practice
    description: SLIs, SLOs, error budgets and reducing toil.
    requires: [observability:2]
  incident-management:
    name: Incident management
    kind: practice
    description: On-call, incident response, communication and blameless postmortems.
    requires: [observability:1]
  capacity-planning:
    name: Capacity planning
    kind: practice
    description: Forecasting load and sizing systems before they run out of headroom.
    requires: [observability:2]
  chaos-engineering:
    name: Chaos engineering
    kind: practice
    description: Injecting failures on purpose to prove resilience.
    requires: [sre-practices:2, kubernetes:2]
  gitops:
    name: GitOps
    kind: practice
    description: Deploying by reconciling clusters to Git (Argo CD, Flux).
    requires: [kubernetes:2, ci-cd:2]
  service-mesh:
    name: Service mesh
    kind: platform
    description: Traffic management, mTLS and observability between services (Istio, Linkerd).
    requires: [kubernetes:3, computer-networking:2]
  internal-developer-platforms:
    name: Internal developer platforms
    kind: concept
    description: Self-service golden paths, templates and portals (e.g. Backstage) for product teams.
    requires: [kubernetes:2, ci-cd:2, infrastructure-as-code:2]
  secrets-management:
    name: Secrets management
    kind: practice
    description: Storing, rotating and injecting secrets (Vault, cloud secret managers).
    requires: [identity-access-management:1]
  finops:
