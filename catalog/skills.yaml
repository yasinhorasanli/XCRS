# Shared skills catalog (ADR-0025, ADR-0028). One entry per skill or concept, used by every role.
#
# kind:        language | framework | library | tool | platform | concept | practice
# proficiency: 1 basic (knows what it is, follows guides) · 2 working (uses it on routine work)
#              3 advanced (designs with it, solves hard problems, guides others) · 4 expert (sets direction)
# requires:    prerequisites. Every entry must hold (AND); "a|b|c:2" inside one entry means any one of them
#              (OR), and ":n" is the proficiency needed in it. Only real prerequisites, not "nice to know".
# onet:        matching O*NET 31.0 "Workplace Example" names (evidence of employer demand), when they exist.

skills:
  # --- Computing foundations --------------------------------------------------------------------
  programming-fundamentals:
    name: Programming fundamentals
    kind: concept
    description: Variables, control flow, functions, data types and reading/writing code in one language.
  data-structures:
    name: Data structures
    kind: concept
    description: Arrays, lists, hash maps, trees, graphs, queues and when to use each.
    requires: [programming-fundamentals:2]
  algorithms:
    name: Algorithms and complexity
    kind: concept
    description: Searching, sorting, recursion, graph traversal and Big-O reasoning about time and memory.
    requires: [data-structures:2]
  oop:
    name: Object-oriented programming
    kind: concept
    description: Classes, encapsulation, inheritance, composition and interfaces.
    requires: [programming-fundamentals:2]
  functional-programming:
    name: Functional programming
    kind: concept
    description: Pure functions, immutability, higher-order functions and composition.
    requires: [programming-fundamentals:2]
  design-patterns:
    name: Design patterns
    kind: concept
    description: Common solutions such as factory, strategy, observer and dependency injection, and their trade-offs.
    requires: [oop:2]
  clean-code:
    name: Clean code and refactoring
    kind: practice
    description: Naming, small functions, removing duplication and changing code safely in small steps.
    requires: [programming-fundamentals:2]
  debugging:
    name: Debugging
    kind: practice
    description: Reproducing bugs, reading stack traces, using a debugger and narrowing causes systematically.
    requires: [programming-fundamentals:2]
  profiling:
    name: Profiling and performance tuning
    kind: practice
    description: Measuring CPU, memory and I/O hot spots before optimizing.
    requires: [debugging:2]
  operating-systems:
    name: Operating systems
    kind: concept
    description: Processes, threads, memory, file systems and system calls.
    requires: [programming-fundamentals:1]
  concurrency:
    name: Concurrency
    kind: concept
    description: Threads, async I/O, locks, race conditions and deadlocks.
    requires: [programming-fundamentals:2, operating-systems:1]
  computer-networking:
    name: Computer networking
    kind: concept
    description: TCP/IP, DNS, ports, routing, latency and how data moves between machines.
  http:
    name: HTTP and the web
    kind: concept
    description: Requests and responses, methods, status codes, headers, cookies and TLS.
    requires: [computer-networking:1]
  linux:
    name: Linux and the command line
    kind: platform
    description: Navigating the shell, files and permissions, processes, packages and services.
    onet: [Linux, UNIX, Red Hat Enterprise Linux]
  shell-scripting:
    name: Shell scripting
    kind: language
    description: Automating tasks with Bash scripts, pipes and common Unix tools.
    requires: [linux:1]
    onet: [Bash, Shell script, UNIX Shell]
  powershell:
    name: PowerShell
    kind: language
    description: Scripting and automating Windows and cloud administration.
    onet: [Microsoft PowerShell]
  git:
    name: Git
    kind: tool
    description: Commits, branches, merging, rebasing and resolving conflicts.
    onet: [Git, GitHub, GitLab, Atlassian Bitbucket]
  code-review:
    name: Code review and pull requests
    kind: practice
    description: Proposing changes as pull requests and giving and receiving useful review.
    requires: [git:2]
  testing-fundamentals:
    name: Testing fundamentals
    kind: concept
    description: Why and what to test, the test pyramid, test doubles and test design techniques.
    requires: [programming-fundamentals:1]
  unit-testing:
    name: Unit testing
    kind: practice
    description: Writing fast, isolated tests with a test framework such as pytest, JUnit or Jest.
    requires: [testing-fundamentals:1, programming-fundamentals:2]
    onet: [JUnit]
  integration-testing:
    name: Integration testing
    kind: practice
    description: Testing components together with real databases, queues or services.
    requires: [unit-testing:2]
  tdd:
    name: Test-driven development
    kind: practice
    description: Writing the test first and growing the design in small red-green-refactor steps.
    requires: [unit-testing:2]
  regular-expressions:
    name: Regular expressions
    kind: concept
    description: Matching and extracting text patterns.
    requires: [programming-fundamentals:1]

  # --- Programming languages --------------------------------------------------------------------
  python:
    name: Python
    kind: language
    description: General-purpose language for back ends, automation, data and AI.
    requires: [programming-fundamentals:1]
    onet: [Python]
  javascript:
    name: JavaScript
    kind: language
    description: The language of the web, in browsers and on servers.
    requires: [programming-fundamentals:1]
    onet: [JavaScript]
  typescript:
    name: TypeScript
    kind: language
    description: JavaScript with static types, used for large front-end and Node.js code bases.
    requires: [javascript:2]
    onet: [TypeScript]
  java:
    name: Java
    kind: language
    description: Statically typed JVM language widely used for enterprise back ends.
    requires: [programming-fundamentals:1]
    onet: [Oracle Java]
  kotlin:
    name: Kotlin
    kind: language
    description: Modern JVM language and the main language for Android.
    requires: [programming-fundamentals:1]
  swift:
    name: Swift
    kind: language
    description: Apple's language for iOS, iPadOS and macOS apps.
    requires: [programming-fundamentals:1]
    onet: [Swift]
  csharp:
    name: C#
    kind: language
    description: .NET language for back ends, desktop apps and Unity games.
    requires: [programming-fundamentals:1]
    onet: [C#]
  go:
    name: Go
    kind: language
    description: Simple compiled language popular for cloud services and infrastructure tools.
    requires: [programming-fundamentals:1]
    onet: [Go]
  rust:
    name: Rust
    kind: language
    description: Memory-safe systems language without a garbage collector.
    requires: [programming-fundamentals:2]
  c:
    name: C
    kind: language
    description: Low-level language for operating systems, embedded devices and performance-critical code.
    requires: [programming-fundamentals:1]
    onet: [C]
  cpp:
    name: C++
    kind: language
    description: High-performance language for games, embedded systems and engines.
    requires: [programming-fundamentals:1]
    onet: [C++]
  php:
    name: PHP
    kind: language
    description: Server-side language behind many web sites and CMSs.
    requires: [programming-fundamentals:1]
    onet: [PHP]
  dart:
    name: Dart
    kind: language
    description: Language used by Flutter for cross-platform apps.
    requires: [programming-fundamentals:1]
  r:
    name: R
    kind: language
    description: Language for statistics and data analysis.
    requires: [programming-fundamentals:1]
    onet: [R]
  sql:
    name: SQL
    kind: language
    description: Querying and changing relational data with SELECT, JOIN, GROUP BY and window functions.
    onet: [Structured query language SQL, Transact-SQL]
  solidity:
    name: Solidity
    kind: language
    description: Language for Ethereum smart contracts.
    requires: [programming-fundamentals:2, ethereum:1]

  # --- Web front end ----------------------------------------------------------------------------
  html:
    name: HTML
    kind: language
    description: Semantic page structure, forms and media.
    onet: [Hypertext markup language HTML]
  css:
    name: CSS
    kind: language
    description: Styling, the box model, Flexbox, Grid and cascade rules.
    requires: [html:1]
    onet: [Cascading style sheets CSS]
  responsive-design:
    name: Responsive design
    kind: practice
    description: Layouts that work on every screen size.
    requires: [css:2]
  accessibility:
    name: Web accessibility
    kind: practice
    description: WCAG, semantic markup, keyboard use and screen readers.
    requires: [html:2]
  dom:
    name: DOM and browser APIs
    kind: concept
    description: Manipulating the page, events, fetch and storage from JavaScript.
    requires: [html:1, javascript:2]
  browser-devtools:
    name: Browser developer tools
    kind: tool
    description: Inspecting elements, network, performance and storage in the browser.
    requires: [html:1]
  react:
    name: React
    kind: framework
    description: Component-based UI library with hooks and a large ecosystem.
    requires: [javascript:2, dom:1]
    onet: [React]
  vue:
    name: Vue.js
    kind: framework
    description: Progressive component framework for building user interfaces.
    requires: [javascript:2, dom:1]
    onet: [Vue.js]
  angular:
    name: Angular
    kind: framework
    description: Full front-end framework with TypeScript, dependency injection and RxJS.
    requires: [typescript:2, dom:1]
    onet: [Google Angular]
  nextjs:
    name: Next.js
    kind: framework
    description: React framework for server rendering, routing and full-stack apps.
    requires: [react:2]
  nuxt:
    name: Nuxt
    kind: framework
    description: Vue framework for server rendering, routing and full-stack apps.
    requires: [vue:2]
  state-management:
    name: Front-end state management
    kind: concept
    description: Managing shared client state and server data (stores, caching, query libraries).
    requires: [react|vue|angular:2]
  tailwind-css:
    name: Tailwind CSS
    kind: framework
    description: Utility-first CSS framework.
    requires: [css:2]
  frontend-build-tools:
    name: Front-end build tools
    kind: tool
    description: Package managers, bundlers and dev servers such as npm/pnpm and Vite.
    requires: [javascript:2]
  frontend-testing:
    name: Front-end testing
    kind: practice
    description: Component and unit tests for UIs (Testing Library, Vitest/Jest).
    requires: [unit-testing:1, react|vue|angular:1]
  e2e-testing:
    name: End-to-end testing
    kind: practice
    description: Driving the real app in a browser with Playwright or Cypress.
    requires: [testing-fundamentals:2, javascript|typescript|python|java:2]
  web-performance:
    name: Web performance
    kind: practice
    description: Core Web Vitals, loading strategies, rendering cost and caching in the browser.
    requires: [browser-devtools:2, dom:2]
  design-systems:
    name: Design systems
    kind: practice
    description: Shared, documented UI components and tokens used across products.
    requires: [css:3, react|vue|angular:2]
  frontend-architecture:
    name: Front-end architecture
    kind: concept
    description: "Structuring large UIs: modules, rendering strategies, micro-frontends and data flow."
    requires: [state-management:2, web-performance:2]
  ui-ux-basics:
    name: UI/UX basics for engineers
    kind: concept
    description: Usability, visual hierarchy, and working with designers' files (e.g. Figma).
    onet: [Figma]

  # --- Back end -----------------------------------------------------------------------------------
  rest-api-design:
    name: REST API design
    kind: concept
    description: Resources, methods, status codes, pagination, versioning and error formats.
    requires: [http:2]
  graphql:
    name: GraphQL
    kind: framework
    description: Query language and runtime for APIs with typed schemas.
    requires: [http:2]
    onet: [GraphQL]
  grpc:
    name: gRPC and Protocol Buffers
    kind: framework
    description: High-performance RPC with typed contracts between services.
    requires: [http:2]
  nodejs:
    name: Node.js
    kind: platform
    description: JavaScript runtime for servers, with Express/Fastify-style frameworks.
    requires: [javascript:2]
    onet: [Node.js]
  django:
    name: Django
    kind: framework
    description: Batteries-included Python web framework.
    requires: [python:2]
    onet: [Django]
  fastapi:
    name: FastAPI
    kind: framework
    description: Python framework for typed, async HTTP APIs.
    requires: [python:2]
  spring-boot:
    name: Spring Boot
    kind: framework
    description: Java framework for production-ready services.
    requires: [java:2]
    onet: [Spring Boot, Spring Framework]
  aspnet-core:
    name: ASP.NET Core
    kind: framework
    description: .NET framework for web APIs and apps.
    requires: [csharp:2]
    onet: [Microsoft ASP.NET, Microsoft .NET Framework]
  go-web-services:
    name: Go web services
    kind: framework
    description: Building HTTP services in Go with the standard library or a light router.
    requires: [go:2]
  relational-databases:
    name: Relational databases
    kind: concept
    description: Tables, keys, transactions and isolation levels.
    requires: [sql:1]
  postgresql:
    name: PostgreSQL
    kind: platform
    description: Open-source relational database with rich types and extensions.
    requires: [relational-databases:1]
    onet: [PostgreSQL]
  mysql:
    name: MySQL
    kind: platform
    description: Widely used open-source relational database.
    requires: [relational-databases:1]
    onet: [MySQL]
  database-design:
    name: Database design and indexing
    kind: concept
    description: Normalization, schema evolution, indexes and query plans.
    requires: [sql:2, relational-databases:2]
  orm:
    name: ORMs and data access
    kind: concept
    description: Mapping objects to tables, migrations and avoiding N+1 queries.
    requires: [sql:2, oop:1]
    onet: [Hibernate ORM]
  nosql-databases:
    name: NoSQL databases
    kind: concept
    description: Document, key-value, wide-column and graph stores and when they fit.
    onet: [NoSQL]
  mongodb:
    name: MongoDB
    kind: platform
    description: Document database.
    requires: [nosql-databases:1]
    onet: [MongoDB]
  redis:
    name: Redis
    kind: platform
    description: In-memory data store for caching, queues and rate limiting.
    onet: [Redis]
  caching:
    name: Caching
    kind: concept
    description: Cache layers, invalidation, TTLs and consistency trade-offs.
    requires: [data-structures:1]
  elasticsearch:
    name: Search engines (Elasticsearch/OpenSearch)
    kind: platform
    description: Full-text search, indexing and relevance.
    onet: [Elasticsearch]
  authentication-authorization:
    name: Authentication and authorization
    kind: concept
    description: Sessions, tokens (JWT), OAuth 2.0/OIDC and access control.
    requires: [http:2]
  message-brokers:
    name: Message brokers and queues
    kind: concept
    description: Asynchronous messaging, delivery guarantees and back-pressure (RabbitMQ, SQS).
    requires: [computer-networking:1]
  kafka:
    name: Apache Kafka
    kind: platform
    description: Distributed event log for streaming and event-driven systems.
    requires: [message-brokers:1]
    onet: [Apache Kafka]
  distributed-systems:
    name: Distributed systems
    kind: concept
    description: Consistency, replication, partitioning, consensus and failure modes.
    requires: [computer-networking:2, concurrency:2]
  microservices:
    name: Microservices
    kind: concept
    description: Splitting systems into services, their contracts and operational costs.
    requires: [rest-api-design:2, distributed-systems:1]
  event-driven-architecture:
    name: Event-driven architecture
    kind: concept
    description: Events, sagas, outbox pattern and eventual consistency.
    requires: [message-brokers:2]
  domain-driven-design:
    name: Domain-driven design
    kind: concept
    description: Modelling a domain with bounded contexts, aggregates and a shared language.
    requires: [design-patterns:2]
  system-design:
    name: System design
    kind: practice
    description: Designing scalable, reliable systems end to end and explaining the trade-offs.
    requires: [distributed-systems:2, database-design:2, caching:2]
  architecture-patterns:
    name: Architecture patterns
    kind: concept
    description: Layered, hexagonal, modular monolith, microservices and event-driven styles.
    requires: [design-patterns:2, system-design:1]
  api-security:
    name: API security
    kind: practice
    description: Input validation, rate limiting, secrets handling and the OWASP API Top 10.
    requires: [web-security:2, authentication-authorization:2]

  # --- Mobile -----------------------------------------------------------------------------------
  android-sdk:
    name: Android SDK
    kind: platform
    description: Activities, lifecycle, permissions and the Android platform APIs.
    requires: [kotlin|java:2]
    onet: [Google Android]
  jetpack-compose:
    name: Jetpack Compose
    kind: framework
    description: Android's declarative UI toolkit.
    requires: [android-sdk:1, kotlin:2]
  kotlin-coroutines:
    name: Kotlin coroutines and Flow
    kind: library
    description: Asynchronous programming on Android.
    requires: [kotlin:2, concurrency:1]
  ios-sdk:
    name: iOS SDK
    kind: platform
    description: App lifecycle, UIKit and the iOS platform frameworks.
    requires: [swift:2]
    onet: [Apple iOS]
  swiftui:
    name: SwiftUI
    kind: framework
    description: Apple's declarative UI framework.
    requires: [swift:2]
  swift-concurrency:
    name: Swift concurrency
    kind: concept
    description: async/await, actors and structured concurrency in Swift.
    requires: [swift:2, concurrency:1]
  mobile-architecture:
    name: Mobile app architecture
    kind: concept
    description: MVVM, unidirectional data flow, modularization and dependency injection in apps.
    requires: [android-sdk|ios-sdk:2, design-patterns:1]
  mobile-data-persistence:
    name: Mobile data and offline storage
    kind: concept
    description: Local databases, caching and syncing for offline-first apps.
    requires: [android-sdk|ios-sdk|flutter|react-native:1]
  mobile-testing:
    name: Mobile testing
    kind: practice
    description: Unit, UI and device testing for apps.
    requires: [unit-testing:1, android-sdk|ios-sdk|flutter|react-native:1]
  app-store-release:
    name: App store release and distribution
    kind: practice
    description: Signing, store review, staged rollouts and crash reporting.
    requires: [android-sdk|ios-sdk|flutter|react-native:1]
  flutter:
    name: Flutter
    kind: framework
    description: Cross-platform UI toolkit using Dart.
    requires: [dart:2]
  react-native:
    name: React Native
    kind: framework
    description: Cross-platform mobile apps with React.
    requires: [react:2]

  # --- Games ------------------------------------------------------------------------------------
  unity:
    name: Unity
    kind: platform
    description: Game engine using C#.
    requires: [csharp:2]
  unreal-engine:
    name: Unreal Engine
    kind: platform
    description: Game engine using C++ and Blueprints.
    requires: [cpp:2]
  game-math:
    name: Game math
    kind: concept
    description: Vectors, matrices, quaternions and transformations.
    requires: [linear-algebra:1]
  game-physics:
    name: Game physics
    kind: concept
    description: Collisions, rigid bodies and simulation.
    requires: [game-math:2]
  computer-graphics:
    name: Computer graphics and rendering
    kind: concept
    description: The rendering pipeline, lighting, materials and GPU basics.
    requires: [game-math:2]
  shaders:
    name: Shader programming
    kind: language
    description: Writing GPU shaders (HLSL/GLSL/shader graphs).
    requires: [computer-graphics:2]
  game-design-basics:
    name: Game design basics
    kind: concept
    description: Game loops, mechanics, level design and player feedback.
  multiplayer-networking:
    name: Multiplayer networking
    kind: concept
    description: Client-server sync, prediction and latency hiding.
    requires: [computer-networking:2, unity|unreal-engine:2]
  game-optimization:
    name: Game performance optimization
    kind: practice
    description: Frame budgets, memory and draw-call optimization.
    requires: [profiling:2, unity|unreal-engine:2]

  # --- Embedded ---------------------------------------------------------------------------------
  digital-electronics:
    name: Digital electronics
    kind: concept
    description: Logic, voltages, signals, reading schematics and datasheets.
  computer-architecture:
    name: Computer architecture
    kind: concept
    description: CPUs, memory hierarchy, interrupts and instruction sets.
    requires: [digital-electronics:1]
  microcontrollers:
    name: Microcontroller programming
    kind: practice
    description: Registers, GPIO, timers and interrupts on microcontrollers (e.g. ARM Cortex-M).
    requires: [c:2, computer-architecture:1]
  communication-protocols:
    name: Embedded communication protocols
    kind: concept
    description: UART, SPI, I2C, CAN and their timing.
    requires: [microcontrollers:1]
  rtos:
    name: Real-time operating systems
    kind: platform
    description: Tasks, scheduling and synchronization with an RTOS such as FreeRTOS or Zephyr.
    requires: [microcontrollers:2, concurrency:2]
  embedded-linux:
    name: Embedded Linux
    kind: platform
    description: "Building and running Linux on devices: boot, drivers and cross-compilation."
    requires: [linux:2, c:2]
  hardware-debugging:
    name: Hardware debugging
    kind: practice
    description: Debug probes, oscilloscopes and logic analyzers.
    requires: [microcontrollers:2]

  # --- DevOps, cloud and reliability --------------------------------------------------------------
  docker:
    name: Docker and containers
    kind: tool
    description: Building images and running containers.
    requires: [linux:2]
    onet: [Docker]
  kubernetes:
    name: Kubernetes
    kind: platform
    description: "Orchestrating containers: deployments, services, configuration and scaling."
    requires: [docker:2, computer-networking:2]
    onet: [Kubernetes, Red Hat OpenShift]
  helm:
    name: Helm
    kind: tool
    description: Packaging and templating Kubernetes applications.
    requires: [kubernetes:2]
  ci-cd:
    name: CI/CD
    kind: practice
    description: Automated build, test and deploy pipelines.
    requires: [git:2]
  github-actions:
    name: GitHub Actions
    kind: tool
    description: CI/CD workflows hosted by GitHub.
    requires: [ci-cd:1]
  jenkins:
    name: Jenkins
    kind: tool
    description: Self-hosted automation server for CI/CD.
    requires: [ci-cd:1]
    onet: [Jenkins CI]
  cloud-fundamentals:
    name: Cloud fundamentals
    kind: concept
    description: Regions, compute, storage, managed services, shared responsibility and pricing.
    requires: [computer-networking:1, linux:1]
  aws:
    name: AWS
    kind: platform
    description: "Amazon Web Services: EC2, S3, IAM, VPC, RDS, Lambda and more."
    requires: [cloud-fundamentals:1]
    onet: [Amazon Web Services AWS software, Amazon Elastic Compute Cloud EC2]
  azure:
    name: Microsoft Azure
    kind: platform
    description: Microsoft's cloud platform.
    requires: [cloud-fundamentals:1]
    onet: [Microsoft Azure software]
  gcp:
    name: Google Cloud
    kind: platform
    description: Google Cloud Platform.
    requires: [cloud-fundamentals:1]
  identity-access-management:
    name: Identity and access management
    kind: concept
    description: Users, roles, policies and least privilege in cloud and enterprise systems.
    requires: [cloud-fundamentals:1]
  cloud-networking:
    name: Cloud networking
    kind: concept
    description: VPCs, subnets, load balancers, DNS and private connectivity.
    requires: [computer-networking:2, cloud-fundamentals:2]
  serverless:
    name: Serverless
    kind: concept
    description: Functions, event triggers and managed services without servers to run.
