# Curated learning resources (ADR-0026, ADR-0033): official documentation and well-known free courses,
# reviewed as pull requests like the rest of the catalog. `teaches` lists catalog skills with the
# proficiency the resource gets a learner to (1 basic · 2 working · 3 advanced · 4 expert).
#
# type: docs | course | tutorial | video | playlist | book     level: beginner | intermediate | advanced
# Links are checked with `uv run xcrs resources check-links` (never in CI). Drafted by Claude
# (2026-10-02), links verified live (fastapi.tiangolo.com could not be resolved from the build machine);
# which resource is *best* per skill is for review.

