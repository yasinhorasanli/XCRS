# Publish the container images to GHCR (ADR-0034): every push to main, or by hand.
# Tags: the commit SHA (immutable, what deploy/deploy.sh pins) and the branch name (moving; "/" becomes "-").
# Each tag is a multi-platform image: linux/amd64 for the VMs, linux/arm64 for the AWS copy's Graviton
# instance (ADR-0042). Docker pulls the matching one. Each platform builds natively on its own runner
# (QEMU emulation would be several times slower), pushes by digest only, and a final job joins the
# digests under the tags, so a tag never points at one platform alone.
# Deploying stays a manual step on the VM until there are users (deploy/README.md).
name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        image:
          - {name: xcrs-api, context: backend}
          - {name: xcrs-web, context: frontend}
        platform:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}   # free GitHub-hosted ARM runner (public repos)
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: Save the digest for the merge job
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [xcrs-api, xcrs-web]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Tag both platforms as one image (commit SHA and branch name)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          digests=(*)
          test "${#digests[@]}" -eq 2   # amd64 + arm64, or the tag would be missing a platform
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:${BRANCH//\//-}" \
            "${digests[@]/#/$IMAGE@sha256:}"
      - name: Show the platforms behind the tag
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
