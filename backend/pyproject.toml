[project]
name = "xcrs"
version = "0.1.0"
description = "Explainable Course Recommendation System"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "alembic>=1.16",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
    "numpy>=2.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xcrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
xcrs = "xcrs.cli:main"
