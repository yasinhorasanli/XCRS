# Thin or one-sided boards for the role gate (ADR-0052): which roles may be shown, if any.
# Same board format as learner_profiles.yaml. `may_show: []` means no role should be shown; otherwise at least one
# role must be shown and every role shown must be in the list.
#
# Used by tests/test_role_scoring.py and eval/bench_role_gate.py. Added 2026-10-12 after the decider tried
# "Python, enjoyed" (50% interest, three near-tied roles) and "SQL, didn't enjoy" (three zero-score roles).

boards:
  - id: one-generic-language
    liked: [python]
    may_show: []
  - id: one-generic-language-expert
    liked: [python:4]
    may_show: []
  - id: one-generic-tool
    liked: [git]
    may_show: []
  - id: only-a-dislike
    disliked: [sql]
    may_show: []
  - id: only-dislikes
    disliked: [javascript, react]
    may_show: []
  - id: only-generic-neutral
    neutral: [git:2, linux:2]
    may_show: []
  - id: generic-like-and-a-dislike
    liked: [python]
    disliked: [sql]
    may_show: []
  - id: one-distinctive-skill
    liked: [spreadsheets]
    may_show: [data-analyst, analytics-engineer]
  - id: curious-about-one-field
    curious: [machine-learning-fundamentals]
    may_show: [data-scientist, machine-learning-engineer, applied-scientist]
