# Skill-matching evaluation set (ADR-0029): what a learner might type on the skill board, and which
# catalog skills it should match. Used to compare matching methods and to choose thresholds (ADR-0030).
#
#   expect: every one of these must be matched          (recall)
#   any:    at least one of these must be matched        (for vague phrases)
#   accept: also fine if matched; anything else is wrong (precision)
#   expect: [] with no `any` = the phrase should match nothing
#
# kind: exact · alias (abbreviation or other name) · typo · paraphrase (described, not named) ·
#       tool (a tool not in the catalog → the skill it belongs to) · multi (several skills) ·
#       broad (vague) · course (a course or video title) · unrelated (not a software skill)
#
# Drafted by Claude (2026-10-01); reviewed by sampling (ADR-0029). Fix wrong cases in a pull request.

