# CV import evaluation set (ADR-0045). Every person, employer and address here is invented.
#
# Each case is a CV (`cv`, rendered to `pdf/<id>.pdf` by make_cvs.py + print_pdfs.mjs) with what an import
# should find:
#   expect:   catalog skill ids the CV clearly shows (named, or described unmistakably); recall counts these
#   accept:   reasonable extras (implied or neighbouring skills); not counted against precision
#   band:     the experience band (ADR-0041) as of `today` below; null = can't be told
#   warnings: what the injection checks should report (hidden pieces, instruction-like lines), at least
#   error:    the import should refuse with this error instead (e.g. a scanned PDF)
#
# layout: linkedin (two columns, like LinkedIn's "Save to PDF") | classic (one column) | scanned (image only)
# ui: the language of headings and dates (LinkedIn writes its export in the interface language)
# Dates in `cv` are YYYY-MM; end null = current position.

