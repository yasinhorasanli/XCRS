# Labeled learner profiles for engine v2 role scoring (ADR-0031): what a learner puts on the skill board,
# and which roles and level a career adviser would expect. Used to calibrate the score's weights
# (eval/bench_role_scoring.py) and to check level estimates.
#
#   liked / neutral / disliked / curious: catalog skills, "skill:proficiency" (1-4) or "skill" (unrated)
#   expect: the role(s) that should rank first; the first one is the main expectation (hit@1, hit@3, level)
#   accept: also a fine first answer (adjacent roles)
#   level:  the level the learner would start at in the main role (entry / mid / senior / staff)
#
# Drafted by Claude (2026-10-02) while the decider slept (delegated, ADR-0031); to be reviewed by sampling,
# like the matching set (ADR-0029). Kinds: role (one per role), student, career-change, mixed, senior.

