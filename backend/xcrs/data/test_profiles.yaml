# Test profiles for the decider's manual checks (the /dev/profiles page; not shown to users).
# Each is what a real person with this background would plausibly put on the board: their main skills with a
# 1-4 rating, a few they didn't enjoy, a few they are curious about. They don't list every basic skill, just as
# real learners don't. `expect` and `level` are what a career adviser would answer; the page shows them next to
# the engine's answer, so mismatches stand out.
#
#   liked / neutral / disliked / curious: catalog skill ids, "skill:proficiency" (1-4) or "skill" (unrated)
#   expect: roles that should rank high (first = main); level: where they'd start in the main role
#   experience: years in software, as the board asks (student, 0-2, 2-5, 5-10, 10+); optional

