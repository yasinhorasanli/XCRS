# VM-B (16 GB): the explanation and matching LLM only (ADR-0020, ADR-0034). Ollama has no authentication,
# so it is published only on VM-B's private address, and the host firewall allows only VM-A (deploy/README.md).
#
#   cd deploy/vm-b && cp .env.example .env && docker compose up -d
#   docker compose exec ollama ollama pull qwen3.5:4b
name: xcrs-llm

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${XCRS_PRIVATE_IP:?set XCRS_PRIVATE_IP}:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "1"     # one generation at a time on CPU (ADR-0020 benchmark)
    volumes:
      - ollama_llm:/root/.ollama

volumes:
  ollama_llm:
