# pnpm >= 10 reads settings from here; the "pnpm" field in package.json is ignored.

# Security overrides pinning patched versions of transitive dependencies.
overrides:
  "vite": ">=5.1.7"
  "undici": ">=5.28.4"
  "tar": ">=6.2.1"
  "ws": ">=8.17.1"
  "@nuxt/devtools": ">=1.3.9"
  "micromatch": ">=4.0.8"
  "path-to-regexp": ">=6.3.0"
  "rollup": ">=4.22.4"
  "serve-static": ">=1.16.0"
  "send": ">=0.19.0"
  "cross-spawn": ">=7.0.5"
  "braces": ">=3.0.3"

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
