# pnpm >= 10 reads settings from here; the "pnpm" field in package.json is ignored.

# Security overrides for transitive dependencies of nuxt / @nuxt/ui that still resolve to
# vulnerable versions (Dependabot / `pnpm audit`, 2026-10-01). Each selector matches only the
# vulnerable range and lifts it to the patched release in the same major (simple-git: the next major,
# see below). Remove an entry once `pnpm why <package>` shows upstream ranges have moved past it.
overrides:
  "@babel/core@<7.29.1": "^7.29.1"
  "baseline-browser-mapping@<2.11.0": "^2.11.0"
  "brace-expansion@>=2.0.0 <2.1.7": "^2.1.7"
  "brace-expansion@>=5.0.0 <5.0.12": "^5.0.12"
  "browserslist@<4.28.7": "^4.28.7"
  "esbuild@>=0.27.3 <0.28.1": "^0.28.1"
  # glob and minimatch: no fix in the majors in use (nitropack → @vercel/nft → glob 13 → minimatch 10), so the
  # next major (2026-11-05). Build-time only; the .output file list was the same with and without them.
  "glob@>=9.0.0 <14.0.2": "^14.0.2"
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
  "nanoid@<3.3.18": "^3.3.18"
  "node-forge@<1.4.1": "^1.4.1"
  "postcss@<8.5.23": "^8.5.23"
  "postcss-selector-parser@>=7.1.0 <7.1.3": "^7.1.3"
  "tar@<7.5.21": "^7.5.21"
  "vite@>=8.0.0 <8.0.16": "^8.0.16"
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
  # (simple-git and @simple-git/argv-parser overrides removed 2026-10-26: @nuxt/devtools 3.4.4, with nuxt 4.6.2,
  # no longer uses simple-git.)

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  vue-demi: false # Vue 2/3 shim; its postinstall is not needed on Vue 3

# Local fixes for advisories with no patched release yet (2026-10-03). braces is build tooling (nitropack's
# build globs via globby → micromatch): deeply nested patterns exhaust the stack; the patch refuses nesting
# deeper than 100 levels. pnpm audit can't see patches, so its advisory is ignored below. When an upstream
# release fixes one: remove its patch, its ignore line, and (if it applies) add an override like the ones above.
# (node-forge's patch removed 2026-11-05: 1.4.1+ compares the decrypted bytes with a canonical DigestInfo itself.)
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

auditConfig:
  ignoreGhsas:
    # node-forge <=1.4.0: fixed upstream in 1.4.1 (lib/rsa.js, _encodeDigestInfo), but the advisory still lists
    # no patched version (2026-11-05); the override above keeps node-forge at 1.4.1+.
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3, fixed by patches/braces@3.0.3.patch (advisory since withdrawn)
    # deepmerge <=4.3.1 (low, prototype poisoning of merged objects): no fixed release yet (4.3.1 is the latest,
    # 2026-11-05). Build-time only (nitropack → @rollup/plugin-node-resolve, merging its own options), not in
    # .output. Replace with an override once a fixed release is out.
    - GHSA-gcqx-w48m-w2h4
